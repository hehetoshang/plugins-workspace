[package]
name = "tauri-plugin-shell"
version = "2.3.5"
description = "Access the system shell. Allows you to spawn child processes and manage files and URLs using their default application."
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-shell"
exclude = [
  "/banner.png",
  "/guest-js",
  "/package.json",
  "/rollup.config.js",
  "/test",
  "/tsconfig.json",
]

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "partial", notes = "Only allows to open URLs via `open`" }
ios = { level = "partial", notes = "Only allows to open URLs via `open`" }
ohos = { level = "partial", notes = "URLs via opener UIAbility adapter; processes restricted by application sandbox" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
schemars = { workspace = true }
serde = { workspace = true }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tokio = { version = "1", features = ["time"] }
log = { workspace = true }
thiserror = { workspace = true }
shared_child = "1"
regex = "1"
encoding_rs = "0.8"
os_pipe = "1"

[target.'cfg(not(target_env = "ohos"))'.dependencies]
open = { version = "5", features = ["shellexecute-on-windows"] }

[target.'cfg(target_env = "ohos")'.dependencies]
tauri-plugin-opener = { path = "../opener", version = "2.5.4" }

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { workspace = true, features = ["wry"] }
